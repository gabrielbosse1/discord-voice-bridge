plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.3'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.6.1'
}

version = '1.0.0'
group = 'com.discordvoicebridge'

// Loom registers its own project-level repositories, which makes Gradle ignore
// the settings-level ones, so the repo list lives here (not in settings.gradle).
repositories {
    maven { url 'https://maven.maxhenkel.de/repository/public/' }
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

configurations {
    // Resolvable JDA-only view for shadowJar: JDA and its transitive deps get
    // shaded into our own namespace so they don't collide with other mods.
    // slf4j is provided by Fabric and must not be bundled. Fabric and SVC deps
    // stay out by construction (this configuration only contains JDA).
    shadowRuntime {
        canBeResolved = true
        canBeConsumed = false
        exclude group: 'org.slf4j'
    }
}

dependencies {
    // Minecraft 26.3 ships with Mojang's official named mappings; loom uses them
    // directly, so no mappings line is needed anymore.
    minecraft "com.mojang:minecraft:26.3"
    implementation "net.fabricmc:fabric-loader:0.20.1"
    // Keep Fabric API on the compile classpath and nest its aggregate jar in
    // our release artifact. This makes the declared `fabric` mod dependency
    // available on a clean Fabric server instead of requiring a separate manual
    // install. Fabric API's aggregate jar contains its module jars.
    implementation "net.fabricmc.fabric-api:fabric-api:0.165.0+26.3"
    include "net.fabricmc.fabric-api:fabric-api:0.165.0+26.3"
    // mixin provides @Mixin/@Inject annotations at compile time.
    compileOnly "net.fabricmc:sponge-mixin:0.17.5+mixin.0.8.7"

    // SVC: the public API artifact for compilation, plus the voicechat-fabric
    // runtime jar (2.6.27+26.3) placed in libs/ by the developer/server operator
    // (it is not redistributable here). The runtime jar also provides
    // CommonCompatibilityManager (API instance bootstrap); all other SVC calls
    // stay on the public api artifact. It is never bundled into our jar.
    compileOnly "de.maxhenkel.voicechat:voicechat-api:2.6.27"
    implementation files("libs/voicechat-fabric-2.6.27+26.3.jar")

    // JDA (5.x, includes opus-java native) + admin permission API.
    implementation "net.dv8tion:JDA:5.5.1"
    implementation "me.lucko:fabric-permissions-api:0.7.0"
    include "me.lucko:fabric-permissions-api:0.7.0"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "de.maxhenkel.voicechat:voicechat-api:2.6.27"
    shadowRuntime "net.dv8tion:JDA:5.5.1"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

/**
 * Shade JDA and its transitive dependencies into our own namespace so they
 * don't collide with other mods (Jackson, OkHttp, Okio, ...).
 * slf4j stays out: Fabric provides its own binder.
 * fabric-permissions-api stays out too: loom ships it nested (see `include`).
 */
shadowJar {
    configurations = [project.configurations.shadowRuntime]
    relocate 'net.dv8tion.jda', 'discordvoicebridge.jda'
    relocate 'club.minnced', 'discordvoicebridge.shaded.opusjava'
    relocate 'com.neovisionaries', 'discordvoicebridge.shaded.neovisionaries'
    relocate 'okhttp3', 'discordvoicebridge.shaded.okhttp'
    relocate 'okio', 'discordvoicebridge.shaded.okio'
    relocate 'com.fasterxml.jackson', 'discordvoicebridge.shaded.jackson'
    relocate 'org.apache.commons.collections4', 'discordvoicebridge.shaded.commons-collections4'
    relocate 'net.sf.trove4j', 'discordvoicebridge.shaded.trove4j'
    relocate 'com.github.benmanes.caffeine', 'discordvoicebridge.shaded.caffeine'
    relocate 'com.typesafe.config', 'discordvoicebridge.shaded.typesafe'
    relocate 'org.reactivestreams', 'discordvoicebridge.shaded.reactivestreams'
    exclude 'META-INF/services/*'
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    exclude 'module-info.class'
}

tasks.named('jar') {
    // Fold the shaded tree into the dev jar, and let loom remap this jar
    // into the release artifact.
    dependsOn tasks.named('shadowJar')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(project.provider { zipTree(tasks.shadowJar.archiveFile) })
}

test {
    useJUnitPlatform()
}

// The voicechat-fabric jar is not redistributable, so it is not committed.
// This task fetches the current 26.3 build from Modrinth into libs/.
tasks.register('downloadSvc') {
    def outFile = file("libs/voicechat-fabric-2.6.27+26.3.jar")
    def url = 'https://cdn.modrinth.com/data/9eGKb6K1/versions/x9jLR94Q/voicechat-fabric-2.6.27%2B26.3.jar'
    inputs.property 'url', url
    outputs.file outFile
    onlyIf { !outFile.exists() || outFile.length() == 0 }
    doLast {
        outFile.parentFile.mkdirs()
        def conn = URI.create(url).toURL().openConnection()
        conn.setInstanceFollowRedirects(true)
        outFile.withOutputStream { it << conn.inputStream }
        def sizeMb = String.format("%.1f", outFile.length() / (1024 * 1024))
        logger.lifecycle("Downloaded " + outFile.name + " (" + sizeMb + " MB)")
    }
}
