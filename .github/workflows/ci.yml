name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Simple Voice Chat is not redistributable with this repo, so CI fetches
      # the fabric jar from Modrinth. It is only used to compile against
      # CommonCompatibilityManager and never bundled or republished.
      - name: Fetch Simple Voice Chat from Modrinth
        run: |
          mkdir -p libs
          curl -fL --retry 3 -o "libs/voicechat-fabric-2.6.27+26.3.jar" \
            "https://cdn.modrinth.com/data/9eGKb6K1/versions/x9jLR94Q/voicechat-fabric-2.6.27%2B26.3.jar"

      - name: Build and test
        run: ./gradlew clean test build --no-daemon

      # Every successful main build replaces the jar in the `latest` release,
      # so the newest version is always one download away (CI artifacts only
      # live 90 days). PRs do not publish.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: discord_voice_bridge 1.0.0
          body: |
            Latest build of `main` (commit ${{ github.sha }}).

            Drop `discord_voice_bridge-1.0.0.jar` into your server's `mods/`
            folder. Requires Minecraft 26.3, Fabric, and Simple Voice Chat.
          files: build/libs/discord_voice_bridge-1.0.0.jar
          fail_on_unmatched_files: true
