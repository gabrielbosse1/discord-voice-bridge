name: Arena final build (temporary)
on:
  workflow_dispatch:
  push:
    branches: [arena/07026275-discord-voice-bridge]
    paths: ['.github/workflows/arena-final.yml']
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/07026275-discord-voice-bridge
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Fetch Simple Voice Chat (required by build.gradle)
        run: |
          mkdir -p libs
          curl -fL --retry 3 -o libs/voicechat-fabric-2.6.27+26.3.jar \
            'https://cdn.modrinth.com/data/9eGKb6K1/versions/x9jLR94Q/voicechat-fabric-2.6.27%2B26.3.jar'
          sha256sum libs/*.jar
      - name: Build the final artifact from checked-out source
        run: ./gradlew clean build --no-daemon
      - name: Collect artifact and provenance
        run: |
          mkdir -p final-kit
          cp build/libs/discord_voice_bridge-1.0.0.jar final-kit/final-1.0.0.jar
          {
            echo "build from committed source on branch arena/07026275-discord-voice-bridge"
            echo "commit: $(git rev-parse HEAD)"
            echo "java:"; java -version 2>&1
            echo "gradle:"; ./gradlew --version --no-daemon | head -12
            echo "build/libs:"; ls -l build/libs
            echo "sha256 final jar:"; sha256sum final-kit/final-1.0.0.jar
            echo "sha256 installed CI artifact:"; sha256sum arena-kit/installed-ci.jar
            echo "sha256 earlier fixed jar:"; sha256sum arena-kit/fixed-1.0.0.jar
            echo "processed resource:"; cat build/resources/main/fabric.mod.json
            echo "jar resource:"; unzip -p build/libs/discord_voice_bridge-1.0.0.jar fabric.mod.json
            echo "nested jars:"; unzip -l build/libs/discord_voice_bridge-1.0.0.jar | grep 'META-INF/jars'
          } > final-kit/PROVENANCE.txt
          cat final-kit/PROVENANCE.txt
      - name: Publish final artifact to branch
        run: |
          git config user.name "Arena Agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add -f final-kit
          git commit -m "Arena: final artifact built from fixed source [skip ci]" || echo "nothing to commit"
          git push origin arena/07026275-discord-voice-bridge
