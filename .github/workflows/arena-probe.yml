# Temporary build/fetch harness used by the Arena investigation.
# It builds the mod twice from source with Java 25 and publishes the real
# artifacts plus the offline Fabric server libraries back to this branch,
# because the sandbox cannot reach Gradle's dependency hosts.
# It will be removed before any fix is delivered.
name: Arena offline kit
on:
  workflow_dispatch:
  push:
    branches: [arena/07026275-discord-voice-bridge]
    paths: ['.github/workflows/arena-probe.yml']
permissions:
  contents: write
  actions: read
jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: arena/07026275-discord-voice-bridge
          fetch-depth: 0

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Fetch Simple Voice Chat jar
        run: |
          mkdir -p libs
          curl -fL --retry 3 -o "libs/voicechat-fabric-2.6.27+26.3.jar" \
            "https://cdn.modrinth.com/data/9eGKb6K1/versions/x9jLR94Q/voicechat-fabric-2.6.27%2B26.3.jar"

      - name: Fetch the CI artifact from the merged PR (likely installed jar)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: discord-voice-bridge
          run-id: 41523579820
          path: ci-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CONTROL jar (source exactly as committed)
        run: |
          mkdir -p arena-kit
          ./gradlew clean build --no-daemon
          echo "--- build/libs ---" | tee -a arena-kit/PROVENANCE.txt
          ls -l build/libs | tee -a arena-kit/PROVENANCE.txt
          cp build/libs/discord_voice_bridge-1.0.0.jar arena-kit/control-1.0.0.jar
          cp build/libs/discord_voice_bridge-1.0.0-dev.jar arena-kit/control-1.0.0-dev.jar 2>/dev/null || true
          cp build/resources/main/fabric.mod.json arena-kit/control-build-resources-fabric.mod.json
          find ci-artifact -type f -name '*.jar' -exec cp {} arena-kit/installed-ci.jar \; 2>/dev/null || true
          echo "ci-artifact files:" | tee -a arena-kit/PROVENANCE.txt
          find ci-artifact -type f -printf '%p %s\n' 2>/dev/null | tee -a arena-kit/PROVENANCE.txt || true

      - name: Build CANDIDATE jar (dependency id corrected in CI checkout only)
        run: |
          python3 - <<'PY'
          p = 'src/main/resources/fabric.mod.json'
          s = open(p).read()
          assert '"fabric": ">=0.165.0"' in s, s
          open(p, 'w').write(s.replace('"fabric": ">=0.165.0"', '"fabric-api": ">=0.165.0"'))
          PY
          grep -n 'fabric' src/main/resources/fabric.mod.json | tee -a arena-kit/PROVENANCE.txt
          ./gradlew clean build --no-daemon
          cp build/libs/discord_voice_bridge-1.0.0.jar arena-kit/fixed-1.0.0.jar
          cp build/resources/main/fabric.mod.json arena-kit/fixed-build-resources-fabric.mod.json
          git checkout -- src/main/resources/fabric.mod.json

      - name: Copy SVC jar plus real Fabric Loader 0.20.1 libraries
        run: |
          mkdir -p arena-kit/libraries/org/ow2/asm/asm/9.10.1 \
                   arena-kit/libraries/org/ow2/asm/asm-analysis/9.10.1 \
                   arena-kit/libraries/org/ow2/asm/asm-commons/9.10.1 \
                   arena-kit/libraries/org/ow2/asm/asm-tree/9.10.1 \
                   arena-kit/libraries/org/ow2/asm/asm-util/9.10.1 \
                   arena-kit/libraries/net/fabricmc/sponge-mixin/0.17.5+mixin.0.8.7 \
                   arena-kit/libraries/net/fabricmc/fabric-loader/0.20.1
          for n in asm asm-analysis asm-commons asm-tree asm-util; do
            curl -fsSL -o "arena-kit/libraries/org/ow2/asm/$n/9.10.1/$n-9.10.1.jar" \
              "https://maven.fabricmc.net/org/ow2/asm/$n/9.10.1/$n-9.10.1.jar"
          done
          curl -fsSL -o 'arena-kit/libraries/net/fabricmc/sponge-mixin/0.17.5+mixin.0.8.7/sponge-mixin-0.17.5+mixin.0.8.7.jar' \
            'https://maven.fabricmc.net/net/fabricmc/sponge-mixin/0.17.5+mixin.0.8.7/sponge-mixin-0.17.5+mixin.0.8.7.jar'
          curl -fsSL -o arena-kit/libraries/net/fabricmc/fabric-loader/0.20.1/fabric-loader-0.20.1.jar \
            'https://maven.fabricmc.net/net/fabricmc/fabric-loader/0.20.1/fabric-loader-0.20.1.jar'
          cp "libs/voicechat-fabric-2.6.27+26.3.jar" "arena-kit/voicechat-fabric-2.6.27+26.3.jar"

      - name: Generate the official Fabric server launch jar for 26.3 / 0.20.1
        continue-on-error: true
        run: |
          curl -fsSL -o /tmp/fabric-installer.jar \
            'https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.1.2/fabric-installer-1.1.2.jar'
          mkdir -p arena-kit/srv
          java -jar /tmp/fabric-installer.jar server -dir arena-kit/srv -mcversion 26.3 -loader 0.20.1 -downloadMinecraft
          find arena-kit/srv -type f -printf '%p %s\n' | tee -a arena-kit/PROVENANCE.txt
          rm -f arena-kit/srv/server.jar

      - name: Record environment and hashes
        if: always()
        run: |
          {
            echo "=== java ==="; java -version 2>&1; javac -version 2>&1
            echo "=== gradle ==="; ./gradlew --version --no-daemon 2>&1 | head -20
            echo "=== arena-kit files ==="; find arena-kit -type f -printf '%p %s\n' | sort
            echo "=== sha256 ==="; sha256sum arena-kit/*.jar
          } >> arena-kit/PROVENANCE.txt

      - name: Publish kit to this branch
        if: always()
        run: |
          git config user.email "arena-probe@users.noreply.github.com"
          git config user.name "Arena probe"
          git checkout -B arena/07026275-discord-voice-bridge
          git add -f arena-kit
          git commit -m "probe: offline server kit (temporary) [skip ci]" || echo "nothing to commit"
          git push origin HEAD:arena/07026275-discord-voice-bridge
